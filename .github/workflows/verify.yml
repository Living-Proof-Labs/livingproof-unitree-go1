# SPDX-License-Identifier: Apache-2.0
# Adapter and configuration checks. This repository does not select a world or a
# scenario; those runs are owned by livingproof-verification.
name: Verify
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - run: python3 -m pip install --user uv==0.13.6
      - name: Setup (locked environment, pinned upstream files)
        run: |
          uv sync --locked
          uv run --no-sync python -c "from pathlib import Path; from livingproof_sim_mujoco import pins; print(len(pins.fetch(Path('.'))), 'pinned files verified')"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: mkdir -p artifacts && uv run --no-sync pytest tests --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: tests
          path: artifacts/tests.xml
          retention-days: 14
