# SPDX-License-Identifier: Apache-2.0
version: '3'
vars:
  VERIFIER_COMMIT:
    sh: python3 -c 'import json; print(json.load(open("verification.lock.json"))["releases"]["verifier"]["commit"])'
  CONFIGURATION: '{{.CONFIGURATION | default "playground"}}'
env:
  MUJOCO_GL: osmesa
  PYOPENGL_PLATFORM: osmesa
tasks:
  setup:
    desc: Install dependencies (uv) and download the pinned upstream files
    cmds:
      - uv sync
      - task: fetch
  fetch:
    desc: Download every pin in pins.json into .cache/ and verify its sha256
    cmds: [uv run python -m lpl_go1.fetch]
  check:
    desc: Lint, formatting, and robot/configuration profiles against the pinned v1.5.0 schemas
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - 'uv run python -c "from lpl_go1.profiles import robot, configuration; [configuration(c[\"name\"]) for c in robot()[\"configurations\"]]; print(\"profiles valid\")"'
  test:
    desc: Schemas, pins, gains vs upstream, scenario parameters, lock, scene, PD
    cmds: [uv run pytest tests --junitxml=artifacts/tests.xml]
  reference:
    desc: Tick-by-tick match against Playground's play_go1_joystick.py loop (500 ticks)
    cmds: [uv run python -m lpl_go1.playground_reference]
  evidence:
    desc: "walk-hallway sim evidence for one configuration, no grading: task evidence CONFIGURATION=<name>"
    cmds: ['uv run python -m lpl_go1.evidence {{.CONFIGURATION}} artifacts/evidence/{{.CONFIGURATION}} {{.CLI_ARGS}}']
  stand:
    desc: "Zero-command standing check: task stand [CONFIGURATION=playground]"
    cmds: ['uv run python -m lpl_go1.walk stand --configuration {{.CONFIGURATION}}']
  repin:
    desc: "Fill PENDING_RELEASE refs from real tags: task repin -- runner=v1.4.0 verifier=vX.Y.Z reporter=vX.Y.Z"
    cmds: ['uvx --from git+https://github.com/Living-Proof-Labs/capability-verifier@{{.VERIFIER_COMMIT}} python -m capability_verifier.repin --root . {{.CLI_ARGS}}']
  repin:check:
    desc: Fail while verification.lock.json has PENDING_RELEASE refs or the runner is not on its locked tag
    cmds: ['uvx --from git+https://github.com/Living-Proof-Labs/capability-verifier@{{.VERIFIER_COMMIT}} python -m capability_verifier.repin --root . --check']
  profile:measure:
    desc: Measure robot width, length and mass from the pinned model (robot.json dimensions)
    cmds: [uv run python -m lpl_go1.measure]
