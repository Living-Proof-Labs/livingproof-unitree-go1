version: '3'
vars:
  CONFIGURATION: '{{.CONFIGURATION | default "playground"}}'
env:
  MUJOCO_GL: osmesa
  PYOPENGL_PLATFORM: osmesa
tasks:
  setup:
    desc: Install dependencies (uv) and download the pinned upstream files
    cmds:
      - uv sync
      - task: fetch
  fetch:
    desc: Download every pin in pins.json into .cache/ and verify its sha256
    cmds: [uv run python -m lpl_go1.fetch]
  check:
    desc: Lint, formatting, and robot/configuration profiles against the pinned v1.5.0 schemas
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - 'uv run python -c "from lpl_go1.profiles import robot, configuration; [configuration(c[\"name\"]) for c in robot()[\"configurations\"]]; print(\"profiles valid\")"'
  test:
    desc: Schemas, pins, obs/action layout vs upstream, reference tick match, scenario, scene
    cmds: [uv run pytest tests --junitxml=artifacts/tests.xml]
  reference:
    desc: Tick-by-tick match against Playground's play_go1_joystick.py loop (500 ticks)
    cmds: [uv run python -m lpl_go1.playground_reference]
  walk:
    desc: "walk-hallway@0.1.0, seeds 1-20: task walk [CONFIGURATION=playground]"
    cmds: ['uv run python -m lpl_go1.walk walk --configuration {{.CONFIGURATION}}']
  stand:
    desc: "Zero-command standing check: task stand [CONFIGURATION=playground]"
    cmds: ['uv run python -m lpl_go1.walk stand --configuration {{.CONFIGURATION}}']
  profile:measure:
    desc: Measure robot width, length and mass from the pinned model (robot.json dimensions)
    cmds: [uv run python -m lpl_go1.measure]
