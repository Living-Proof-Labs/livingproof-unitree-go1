[project]
name = "livingproof-unitree-go1"
version = "0.1.0"
description = "Unitree Go1 robot package: pinned model, published controller and the hallway walk check"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mujoco==3.17.0",
    "numpy>=1.26",
    "imageio[ffmpeg]>=2.34",
    "livingproof-sim-mujoco[media]",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpl_go1"]

[tool.uv.sources]
# The runner, pinned to the release tag in verification.lock.json releases.runner
# (v2.0.3, 292589ad15582c26cff2bffcc851e3abaf4ea708). `task repin -- runner=vX.Y.Z`
# rewrites this tag, the lock's releases.runner tag and commit, then runs `uv lock`.
livingproof-sim-mujoco = { git = "https://github.com/Living-Proof-Labs/livingproof-sim-mujoco.git", tag = "v2.0.3" }

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.livingproof]
# walk-hallway CI (capability-verifier walk-hallway.yml) runs livingproof_sim_mujoco.evidence on this
adapter = "lpl_go1.adapter:ROBOT"
